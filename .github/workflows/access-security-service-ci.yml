name: access-security-service CI

on:
  push:
    branches: [ main, develop, 'release/**' ]
    paths:
      - 'access-security-service/**'
      - 'platform-core/**'
      - 'pom.xml'
      - '.github/workflows/access-security-service-ci.yml'
  pull_request:
    branches: [ main, develop, 'release/**' ]
    paths:
      - 'access-security-service/**'
      - 'platform-core/**'
      - 'pom.xml'
      - '.github/workflows/access-security-service-ci.yml'

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # contextLoads() starts the full app, which needs a real database.
    # Matches the defaults in application.yml (localhost:5432/platform_db).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: platform_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test access-security-service (and platform-core, its dependency)
        run: mvn -B clean test -pl access-security-service -am

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: access-security-service Tests
          path: 'access-security-service/target/surefire-reports/*.xml'
          reporter: java-junit
