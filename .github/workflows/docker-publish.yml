name: Docker publish (CD part A)

# Every push to main: build one image per service and upload it to Docker Hub.
# The server then only downloads ready images (part B), it builds nothing.

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # also allows a manual "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # dockerfile folder          -> image name on Docker Hub (mrkk07/<image>)
          - { service: service-registry,        image: service-registry }
          - { service: access-security-service, image: access-service }
          - { service: api-gateway,             image: api-gateway }
          - { service: admin-service,           image: admin-service }
          - { service: business-service,        image: business-service }
          - { service: notification-service,    image: notification-service }
          - { service: admin-portal,            image: admin-portal }
          - { service: provider-portal,         image: provider-portal }
          - { service: patient-portal,          image: patient-portal }

    steps:
      # No settings are passed to the build: the portals work out the tenant,
      # Keycloak and API addresses from the browser address at runtime
      # (see <portal>/src/runtimeConfig.js), so one image runs everywhere.
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Two tags: "latest" (newest) and the commit id (exact version, for rollback).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
