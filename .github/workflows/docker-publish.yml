name: Build and deploy

# Every push to main:
#   part A (build-and-push): build one image per service, upload to Docker Hub.
#   part B (deploy):         tell the server to download them and restart.
# The server builds nothing, and nobody has to SSH in.

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # also allows a manual "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # dockerfile folder          -> image name on Docker Hub (mrkk07/<image>)
          - { service: service-registry,        image: service-registry }
          - { service: access-security-service, image: access-service }
          - { service: api-gateway,             image: api-gateway }
          - { service: admin-service,           image: admin-service }
          - { service: business-service,        image: business-service }
          - { service: notification-service,    image: notification-service }
          - { service: admin-portal,            image: admin-portal }
          - { service: provider-portal,         image: provider-portal }
          - { service: patient-portal,          image: patient-portal }

    steps:
      # No settings are passed to the build: the portals work out the tenant,
      # Keycloak and API addresses from the browser address at runtime
      # (see <portal>/src/runtimeConfig.js), so one image runs everywhere.
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Two tags: "latest" (newest) and the commit id (exact version, for rollback).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Part B. GitHub can't SSH to the server (port 22 is closed to it, and the
  # .pem key must never be stored in GitHub). Instead:
  #   1. GitHub proves who it is to AWS (OIDC) and gets a temporary login for one
  #      role that is ONLY allowed to run commands on this one server.
  #      No AWS keys are stored anywhere.
  #   2. AWS Systems Manager runs scripts/deploy.sh on the server for us.
  # One-time AWS setup: deploy/aws/github-deploy.yml (see docs/DEPLOYMENT.md).
  # Until the repository variables below exist, this job is skipped.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy-production     # never two deploys at the same time
    permissions:
      id-token: write                  # lets GitHub ask AWS for a temporary login
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Log in to AWS (temporary, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run the deploy on the server
        run: |
          # Runs as the ubuntu user in ~/app: get the latest compose/Caddy files,
          # then switch to the images of exactly this commit.
          SCRIPT="cd ~/app && git pull --ff-only --quiet && bash scripts/deploy.sh ${GITHUB_SHA}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":[\"sudo -u ubuntu -H bash -c '$SCRIPT'\"],\"executionTimeout\":[\"1200\"]}" \
            --query Command.CommandId --output text)
          echo "Systems Manager command: $COMMAND_ID"

          # Wait for it to finish (up to 20 minutes), then show the server's output.
          for i in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                       --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Result: $STATUS"
          [ "$STATUS" = "Success" ]
