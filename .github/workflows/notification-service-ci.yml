name: notification-service CI

on:
  push:
    branches: [ main ]
    paths:
      - 'notification-service/**'
      - 'platform-core/**'
      - 'pom.xml'
  pull_request:
    branches: [ main ]
    paths:
      - 'notification-service/**'
      - 'platform-core/**'
      - 'pom.xml'

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test notification-service (and platform-core, its dependency)
        run: mvn -B clean test -pl notification-service -am

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: notification-service Tests
          path: 'notification-service/target/surefire-reports/*.xml'
          reporter: java-junit
