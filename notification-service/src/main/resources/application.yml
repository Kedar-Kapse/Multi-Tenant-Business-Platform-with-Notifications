server:
  port: 8083

spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_ENABLED:true}
    consumer:
      # Per-listener groupId (notification-otp-group / notification-patient-group,
      # set directly on each @KafkaListener) takes precedence over this default.
      group-id: notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.kedar.kapse.platform_core.event.BaseEvent
    # Needed so the auto-configured KafkaTemplate (used by NotificationKafkaConfig's
    # DeadLetterPublishingRecoverer to publish failed events to *.dlq topics) can
    # actually serialize messages — previously notification-service was consumer-only
    # and had no producer config at all.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    properties:
      reconnect.backoff.ms: 5000
      reconnect.backoff.max.ms: 20000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

notification:
  mail:
    from: ${MAIL_FROM:no-reply@invision.local}
    display-name: ${MAIL_DISPLAY_NAME:Invision Patient Portal}
    patient-portal-url: ${PATIENT_PORTAL_URL:http://localhost:3002}

# Restore Production — Manual Nimbus JWT validation via CustomAuthenticationManager
# No issuer-uri auto-config. ValidateToken fetches JWKS from /realms/{tenant}/protocol/openid-connect/certs
keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health
    metadata-map:
      management.port: ${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers,mappings"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
