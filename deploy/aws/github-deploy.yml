AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time setup so GitHub Actions can deploy to the EC2 server without SSH and
  without any stored AWS keys, and so the server itself can use Systems Manager
  (Session Manager instead of SSH) and S3 through an IAM role.
  Upload in the AWS console: CloudFormation -> Create stack -> Upload a template file.

Parameters:
  GitHubRepo:
    Type: String
    Default: Kedar-Kapse/Multi-Tenant-Business-Platform-with-Notifications
    Description: owner/repository that is allowed to deploy (only its main branch)
  InstanceId:
    Type: String
    Description: The EC2 server GitHub may deploy to, e.g. i-0123456789abcdef0
  ReportsBucket:
    Type: String
    Default: kedar-patient-reports-2026
    Description: S3 bucket for patient report files (business-service)
  SecretName:
    Type: String
    Default: kaycare/prod
    Description: >
      Secrets Manager secret holding this server's passwords (create it first:
      Secrets Manager -> Store a new secret -> Other type -> plain text JSON).
      The server may read ONLY this one secret. QA gets its own (kaycare/qa).
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "false only if this AWS account already trusts token.actions.githubusercontent.com"

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # --- 1. AWS trusts GitHub's login tokens (OIDC). Nothing secret is shared. ---
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # --- 2. The role GitHub becomes while deploying. ---
  # Only a job in this repository's "production" GitHub environment can use it --
  # that environment needs a person's approval first. And it can only run
  # commands on this one server -- nothing else in the account.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-deploy
      Description: Used by GitHub Actions (main branch) to deploy via Systems Manager
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:production
      Policies:
        - PolicyName: run-deploy-on-one-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

  # --- 3. The role the SERVER itself has. ---
  # Systems Manager: lets AWS run the deploy, and gives Session Manager
  # (browser terminal, no port 22, no .pem, no "My IP" problem).
  # S3: business-service reads/writes report files without any keys on the server.
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: multi-tenant-server
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: pull-images-from-ecr
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:                                 # download only, no push
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource:
                  - !GetAtt EcrServiceRegistry.Arn
                  - !GetAtt EcrAccessService.Arn
                  - !GetAtt EcrApiGateway.Arn
                  - !GetAtt EcrAdminService.Arn
                  - !GetAtt EcrBusinessService.Arn
                  - !GetAtt EcrNotificationService.Arn
                  - !GetAtt EcrAdminPortal.Arn
                  - !GetAtt EcrProviderPortal.Arn
                  - !GetAtt EcrPatientPortal.Arn
        - PolicyName: read-own-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue   # read only, this one secret
                # AWS adds 6 random characters to a secret's ARN, hence the "-??????"
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-??????
        - PolicyName: patient-reports-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]   # upload + download link, nothing more
                Resource: !Sub arn:aws:s3:::${ReportsBucket}/reports/*

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: multi-tenant-server
      Roles: [!Ref ServerRole]

  # --- 4. Private image storage (ECR): one repository per image, instead of Docker Hub. ---
  # Only our AWS account can see or use them; access is by IAM role, no password.
  # "Scan on push" checks every new image for known security problems, and old
  # images are removed automatically so storage cost stays tiny.
  EcrServiceRegistry:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kaycare/service-registry
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
  EcrAccessService:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kaycare/access-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
  EcrApiGateway:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kaycare/api-gateway
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
  EcrAdminService:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kaycare/admin-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
  EcrBusinessService:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kaycare/business-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
  EcrNotificationService:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kaycare/notification-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
  EcrAdminPortal:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kaycare/admin-portal
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
  EcrProviderPortal:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kaycare/provider-portal
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
  EcrPatientPortal:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kaycare/patient-portal
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}

  # --- 5. The role the GitHub BUILD job becomes: may only push images to these repositories. ---
  GitHubEcrPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-ecr-push
      Description: Used by GitHub Actions (main branch) to push images to ECR
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: push-images-to-kaycare-repositories
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken      # the login step; AWS allows it only on "*"
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !GetAtt EcrServiceRegistry.Arn
                  - !GetAtt EcrAccessService.Arn
                  - !GetAtt EcrApiGateway.Arn
                  - !GetAtt EcrAdminService.Arn
                  - !GetAtt EcrBusinessService.Arn
                  - !GetAtt EcrNotificationService.Arn
                  - !GetAtt EcrAdminPortal.Arn
                  - !GetAtt EcrProviderPortal.Arn
                  - !GetAtt EcrPatientPortal.Arn

Outputs:
  DeployRoleArn:
    Description: Put this in GitHub -> Settings -> Variables as AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  ServerInstanceProfile:
    Description: Attach this to the EC2 server (Actions -> Security -> Modify IAM role)
    Value: !Ref ServerInstanceProfile
  EcrPushRoleArn:
    Description: Put this in GitHub -> Settings -> Variables as AWS_ECR_PUSH_ROLE_ARN
    Value: !GetAtt GitHubEcrPushRole.Arn
  ImagePrefix:
    Description: Put this in the server's ~/app/.env as IMAGE_PREFIX (where the server downloads images from)
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/kaycare
