server:
  port: 8082

spring:
  application:
    name: access-security-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/platform_db}
    # Local dev: localhost:5432/platform_db
    # Docker: postgres:5432/platform_db (set via SPRING_DATASOURCE_URL env var)
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Fail fast when the broker is unreachable so OTP/patient flows aren't blocked.
        # Publish is async with a fallback in NotificationEventPublisher.
        # acks=all (not "1"): if a send DOES reach the broker within the short
        # timeout below, we still want the strongest durability guarantee — the
        # fail-fast behavior comes from the timeouts, not from a weaker acks level.
        max.block.ms: 500
        request.timeout.ms: 1000
        delivery.timeout.ms: 2000
        retries: 0
        acks: "all"

otp:
  length: 6
  ttl-seconds: 60
  max-attempts: 3
  resend-cooldown-seconds: 30
  max-per-window: 5
  rate-window-minutes: 10
  bcrypt-cost: 10

# Direct-mail fallback: if Kafka publish fails, access-security-service sends the
# email itself so OTP delivery is never silently dropped.
spring.mail:
  host: ${SPRING_MAIL_HOST:localhost}
  port: ${SPRING_MAIL_PORT:1025}
  username: ${SPRING_MAIL_USERNAME:}
  password: ${SPRING_MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
        starttls:
          enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

notification:
  mail:
    from: ${MAIL_FROM:no-reply@invision.local}
    display-name: ${MAIL_DISPLAY_NAME:Invision Patient Portal}

# ==========================================================================
# RESTORE PRODUCTION — KEYCLOAK CONFIGURATION
# ==========================================================================
# No issuer-uri auto-config. ValidateToken (Nimbus SignedJWT.parse + RSASSAVerifier)
# manually fetches JWKS from /realms/{tenant}/protocol/openid-connect/certs.
# CustomAuthenticationManager wraps this via .opaqueToken().authenticationManager().
#
# keycloak.base-url: Base URL for JWKS and Admin API endpoints
# keycloak.admin.*: Master realm admin credentials (manages all tenants)
# keycloak.auth.*: Client credentials for proxying user auth requests
keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
  admin:
    server-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  auth:
    client-id: ${KEYCLOAK_AUTH_CLIENT_ID:platform-backend}
    client-secret: ${KEYCLOAK_AUTH_CLIENT_SECRET:}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health

# ==========================================================================
# PORTAL SWITCHING — Cross-portal navigation for ADMIN users
# ==========================================================================
portal:
  switch-code-ttl-seconds: 30
  portals:
    admin:
      name: Admin Portal
      url: ${PORTAL_ADMIN_URL:http://localhost:3000}
    provider:
      name: Provider Portal
      url: ${PORTAL_PROVIDER_URL:http://localhost:3001}
    patient:
      name: Patient Portal
      url: ${PORTAL_PATIENT_URL:http://localhost:3002}

# ==========================================================================
# PCC (PointClickCare) Integration
# Set pcc.mode=real and supply credentials to switch from mock to live API.
# ==========================================================================
pcc:
  mode: ${PCC_MODE:mock}
  base-url: ${PCC_BASE_URL:https://connect.pointclickcare.com}
  token-url: ${PCC_TOKEN_URL:https://connect.pointclickcare.com/auth/token}
  client-id: ${PCC_CLIENT_ID:}
  client-secret: ${PCC_CLIENT_SECRET:}
  org-id: ${PCC_ORG_ID:}
  retry-delay-ms: ${PCC_RETRY_DELAY_MS:300000}

# ==========================================================================
# SERVICE-TO-SERVICE INTERNAL API KEY
# Must match the value configured in business-service.
# Set INTERNAL_API_KEY to a strong random secret (min 32 chars) in production.
# ==========================================================================
internal:
  api-key: ${INTERNAL_API_KEY:changeme-dev-only}

# ==========================================================================
# BUSINESS-SERVICE — internal Feign client
# ==========================================================================
business-service:
  url: ${BUSINESS_SERVICE_URL:http://localhost:8081}

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      business-service:
        connectTimeout: 2000
        readTimeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      business-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        # 30s recovery window — gives business-service enough time to restart
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
  timelimiter:
    instances:
      business-service:
        timeoutDuration: 4s
  # Retry only on network-level failures (not business errors).
  # findByEmail is idempotent; provision/activate are safe to retry because
  # the fallback throws before they can cause duplicates.
  retry:
    instances:
      business-service:
        maxAttempts: 2
        waitDuration: 600ms
        retryExceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.net.SocketTimeoutException

logging:
  level:
    org.springframework.security: DEBUG
    com.kedar.kapse: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers"
  endpoint:
    health:
      show-details: always

rate-limit:
  registration:
    capacity: ${RATE_LIMIT_REGISTRATION_CAPACITY:3}
    refill-tokens: ${RATE_LIMIT_REGISTRATION_REFILL:3}
    refill-period-minutes: ${RATE_LIMIT_REGISTRATION_PERIOD:60}


