# Production overrides, layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds Caddy (HTTPS + routing by hostname) as the only public entry point.
# Every service has restart: unless-stopped, so after a server reboot or a
# crash Docker starts it again by itself -- no SSH needed.
# Needs DOMAIN in the server's .env, e.g. DOMAIN=kapse.online

services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env, e.g. DOMAIN=kapse.online}
      # IPs allowed to open the Keycloak admin console (https://auth.<domain>/admin); empty = nobody
      - KEYCLOAK_ADMIN_ALLOWED_IPS=${KEYCLOAK_ADMIN_ALLOWED_IPS:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates live here; keep it so restarts don't re-request them
      - caddy-config:/config
    depends_on:
      - keycloak
      - api-gateway
      - admin-portal
      - provider-portal
      - patient-portal
    networks:
      - platform-network

  keycloak:
    restart: unless-stopped
    environment:
      # Keycloak sits behind Caddy: trust its X-Forwarded-* headers so
      # login pages and tokens use https://auth.<domain>.
      - KC_PROXY=edge
      # No weak fallbacks in production: a missing secret stops the start.
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is missing - deploy with scripts/deploy.sh}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - deploy with scripts/deploy.sh}

  # Our services run the images GitHub Actions built and pushed
  # (.github/workflows/docker-publish.yml) -- the server builds nothing.
  # IMAGE_PREFIX (server .env) says where they come from:
  #   <account>.dkr.ecr.<region>.amazonaws.com/kaycare   -> private AWS registry (ECR)
  #   not set                                            -> Docker Hub user DOCKERHUB_USERNAME
  # Deploy:  docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
  #          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
  # IMAGE_TAG=<commit sha> in .env pins an exact version (rollback); default latest.
  service-registry:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME:?Set IMAGE_PREFIX (or DOCKERHUB_USERNAME) in .env}}/service-registry:${IMAGE_TAG:-latest}
    restart: unless-stopped
  access-security-service:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME}}/access-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Portal switching sends the user to their own hospital's address.
      - PORTAL_ADMIN_URL=https://{tenant}.admin.${DOMAIN}
      - PORTAL_PROVIDER_URL=https://{tenant}.app.${DOMAIN}
      - PORTAL_PATIENT_URL=https://{tenant}.patient.${DOMAIN}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - deploy with scripts/deploy.sh}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is missing - deploy with scripts/deploy.sh}
      - KEYCLOAK_AUTH_CLIENT_SECRET=${KEYCLOAK_AUTH_CLIENT_SECRET:?KEYCLOAK_AUTH_CLIENT_SECRET is missing - deploy with scripts/deploy.sh}
  api-gateway:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME}}/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
  admin-service:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME}}/admin-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is missing - deploy with scripts/deploy.sh}
  business-service:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME}}/business-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Link in the "complete your registration" email: the patient's hospital portal.
      - PATIENT_PORTAL_URL_TEMPLATE=https://{tenant}.patient.${DOMAIN}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - deploy with scripts/deploy.sh}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is missing - deploy with scripts/deploy.sh}
  notification-service:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME}}/notification-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - deploy with scripts/deploy.sh}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is missing - deploy with scripts/deploy.sh}
  admin-portal:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME}}/admin-portal:${IMAGE_TAG:-latest}
    restart: unless-stopped
  provider-portal:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME}}/provider-portal:${IMAGE_TAG:-latest}
    restart: unless-stopped
  patient-portal:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME}}/patient-portal:${IMAGE_TAG:-latest}
    restart: unless-stopped

  # Infrastructure from the base file: also come back after a reboot or crash.
  postgres:
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - deploy with scripts/deploy.sh}
  redis:
    restart: unless-stopped
  kafka:
    restart: unless-stopped
  maildev:
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
