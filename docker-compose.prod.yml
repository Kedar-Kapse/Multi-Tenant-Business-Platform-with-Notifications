# Production overrides, layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds Caddy (HTTPS + routing by hostname) as the only public entry point.
# Needs DOMAIN in the server's .env, e.g. DOMAIN=kapse.online

services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env, e.g. DOMAIN=kapse.online}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates live here; keep it so restarts don't re-request them
      - caddy-config:/config
    depends_on:
      - keycloak
      - api-gateway
      - admin-portal
      - provider-portal
      - patient-portal
    networks:
      - platform-network

  keycloak:
    environment:
      # Keycloak sits behind Caddy: trust its X-Forwarded-* headers so
      # login pages and tokens use https://auth.<domain>.
      - KC_PROXY=edge

  # Our services run the images GitHub Actions built and pushed to Docker Hub
  # (.github/workflows/docker-publish.yml) -- the server builds nothing.
  # Deploy:  docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
  #          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
  # IMAGE_TAG=<commit sha> in .env pins an exact version (rollback); default latest.
  service-registry:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/service-registry:${IMAGE_TAG:-latest}
  access-security-service:
    image: ${DOCKERHUB_USERNAME}/access-service:${IMAGE_TAG:-latest}
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/api-gateway:${IMAGE_TAG:-latest}
  admin-service:
    image: ${DOCKERHUB_USERNAME}/admin-service:${IMAGE_TAG:-latest}
  business-service:
    image: ${DOCKERHUB_USERNAME}/business-service:${IMAGE_TAG:-latest}
  notification-service:
    image: ${DOCKERHUB_USERNAME}/notification-service:${IMAGE_TAG:-latest}
  admin-portal:
    image: ${DOCKERHUB_USERNAME}/admin-portal:${IMAGE_TAG:-latest}
  provider-portal:
    image: ${DOCKERHUB_USERNAME}/provider-portal:${IMAGE_TAG:-latest}
  patient-portal:
    image: ${DOCKERHUB_USERNAME}/patient-portal:${IMAGE_TAG:-latest}

volumes:
  caddy-data:
  caddy-config:
